<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Match Vision">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Match Vision 3.5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--f:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--purple:#BF5AF2;--orange:#FF9F0A;--green:#30D158;--blue:#32ADE6;--yellow:#FFD60A;--red:#FF453A;--mute:#C9C9C9;--dim:#8A8A8A;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#000}
body{background:#000;color:#fff;font-family:var(--f);min-height:100%;max-width:480px;margin:0 auto;padding-bottom:96px}
.app-header{text-align:center;padding:20px 16px 6px}
.app-header .sub{font-size:10px;letter-spacing:4px;color:var(--mute);text-transform:uppercase;margin-bottom:2px}
.app-header h1{font-size:24px;font-weight:900;background:linear-gradient(135deg,#FFFFFF,#B0B0B0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;display:inline-block}
.app-header .ver{font-size:11px;color:#666;font-weight:700;margin-left:5px}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;background:#0D0D0D;border-top:1px solid #333;z-index:100;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-btn{position:relative;flex:1;padding:13px 4px 11px;background:none;border:none;color:var(--mute);font-size:10px;font-weight:700;cursor:pointer;font-family:var(--f);display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .18s ease}
.nav-btn .ni{font-size:19px;transition:transform .18s ease}
.nav-btn::before{content:'';position:absolute;top:0;left:18%;right:18%;height:3px;background:var(--tab);border-radius:0 0 3px 3px;transform:scaleX(0);transition:transform .2s cubic-bezier(.3,.8,.3,1)}
.nav-btn.active::before{transform:scaleX(1)}.nav-btn.active{color:var(--tab)}.nav-btn.active .ni{transform:translateY(-1px) scale(1.12)}
.page{display:none;padding:12px 16px}.page.active{display:block;animation:pageIn .26s cubic-bezier(.22,.8,.3,1) both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes cardIn{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
@keyframes popIn{0%{transform:scale(.95);opacity:0}60%{transform:scale(1.015)}100%{transform:scale(1);opacity:1}}
@keyframes subIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
button{font-family:var(--f);transition:transform .12s cubic-bezier(.3,.8,.3,1),filter .16s ease;cursor:pointer;color:#fff}
button:active{transform:scale(.955);filter:brightness(1.12)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.card{background:#161616;border-radius:16px;padding:16px 16px;margin-bottom:12px;border:1px solid #333;animation:cardIn .3s cubic-bezier(.22,.8,.3,1) both}
.card.tint{background:#1A0D2A;border-color:#3A2A4E}
.ct{font-size:15px;font-weight:900;margin-bottom:4px}.ct.p{color:var(--purple)}.ct.o{color:var(--orange)}.ct.g{color:var(--green)}.ct.b{color:var(--blue)}.ct.y{color:var(--yellow)}
.cs{font-size:13px;color:var(--dim);line-height:1.45;margin-bottom:12px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.summary-box{background:#161616;border-radius:14px;padding:12px 6px;border:1px solid #333;text-align:center;animation:cardIn .3s both}
.summary-box .bl{font-size:9px;color:var(--mute);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px}
.summary-box .bv{font-size:22px;font-weight:900}.summary-box .bs{font-size:10px;color:var(--dim);margin-top:3px}
.c-p{color:var(--purple)}.c-o{color:var(--orange)}.c-g{color:var(--green)}.c-b{color:var(--blue)}.c-y{color:var(--yellow)}.c-r{color:var(--red)}
.btn-save{flex:1;padding:14px;border-radius:12px;background:linear-gradient(135deg,#BF5AF2,#8E3FBE);border:none;color:#fff;font-size:14px;font-weight:800}
.btn-save.green{background:linear-gradient(135deg,#30D158,#28A745)}.btn-save.yellow{background:linear-gradient(135deg,#FFD60A,#E0A800);color:#1A1405}.btn-save.orange{background:linear-gradient(135deg,#FF9F0A,#D97E00)}
.btn-out{flex:1;padding:14px;border-radius:12px;background:#161616;border:1px solid #3A2A4E;color:var(--purple);font-size:14px;font-weight:800}
.btn-half{flex:1;padding:12px;border-radius:12px;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--mute);font-size:13px;font-weight:700}
.btn-half.blue{border-color:#1A3A5E;color:var(--blue)}.btn-half.green{border-color:#1E3A2A;color:var(--green)}.btn-half.orange{border-color:#3A2A1A;color:var(--orange)}.btn-half.purple{border-color:#3A2A4E;color:var(--purple)}.btn-half.yellow{border-color:#4A3F1A;color:var(--yellow)}.btn-half.red{border-color:#3A1A1A;color:var(--red)}
.btn-danger{width:100%;padding:13px 16px;border-radius:12px;background:#161616;border:1px solid #3A1A1A;color:var(--red);font-size:13px;font-weight:700}
.btn-row{display:flex;gap:8px;margin-top:10px}
.w100{width:100%}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;flex-wrap:wrap}.chips::-webkit-scrollbar{display:none}
.chips.scroll{flex-wrap:nowrap}
.chip{flex:0 0 auto;padding:8px 13px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid #333;background:#161616;color:var(--mute)}
.chip.on{background:#1E1E1E;border-color:var(--c,var(--purple));color:var(--c,var(--purple))}
.lbl{font-size:11px;color:var(--mute);margin:12px 0 6px;display:block;font-weight:600}
input,textarea,select{width:100%;padding:12px 14px;border-radius:12px;background:#101010;border:1px solid #2A2A2A;color:#fff;font-size:15px;font-family:var(--f)}
input:focus,textarea:focus{outline:none;border-color:var(--purple)}
textarea{resize:vertical;line-height:1.4;min-height:70px}
.muted{color:var(--dim);font-size:12.5px;line-height:1.45}
.link{background:none;border:none;color:var(--purple);font-weight:800;font-size:13px;padding:8px 0}
.empty{color:var(--dim);font-size:13px;text-align:center;padding:14px 6px}
/* todo rows */
.todo{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #262626;animation:cardIn .3s both}
.todo:last-child{border-bottom:0}
.todo .ic{width:40px;height:40px;border-radius:12px;background:#1E1E1E;display:grid;place-items:center;font-size:19px;flex:none;overflow:hidden}
.todo .ic img{width:100%;height:100%;object-fit:cover}
.todo .tx{flex:1;min-width:0}
.todo .tt{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;text-align:left;width:100%}
.todo .tt .nx{font-size:9px;font-weight:800;letter-spacing:1px;color:#1A0D2A;background:var(--purple);padding:2px 6px;border-radius:99px}
.todo .pv{font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.mini button{padding:7px 11px;border-radius:99px;font-size:12px;font-weight:800;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--mute)}
.mini button[data-p=tg]{border-color:#1A3A5E;color:var(--blue)}.mini button[data-p=wa]{border-color:#1E3A2A;color:var(--green)}.mini button[data-p=x]{border-color:#444;color:#fff}
.mini button[data-p=gpt],.mini button[data-p=gemini]{border-color:#3A2A4E;color:var(--purple)}
.mini button.done{background:#0F2A1A;border-color:#1E5A34;color:var(--green)}.mini button.done::before{content:'✓ '}
.res{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #262626}.res:last-child{border:0}
.res .n{flex:1;font-size:14px;font-weight:800}.res .n small{display:block;color:var(--dim);font-weight:600;font-size:12px}
.res button{padding:9px 14px;border-radius:10px;font-size:13px;font-weight:800;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--mute)}
.res button.w{border-color:#1E3A2A;color:var(--green)}.res button.l{border-color:#3A1A1A;color:var(--red)}
.rem{display:flex;gap:10px;align-items:center;padding:9px 0;font-size:13.5px;border-bottom:1px solid #262626}.rem:last-child{border:0}
details.done-list summary{list-style:none;cursor:pointer;font-weight:800;font-size:14px;color:var(--green)}
details.done-list summary::-webkit-details-marker{display:none}
details.done-list .d{font-size:13px;color:var(--dim);padding:7px 0;border-bottom:1px solid #262626}
/* post card */
.post{background:#101010;border:1px solid #2A2A2A;border-radius:14px;padding:12px;margin-bottom:10px}
.post .ph{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px;font-size:13.5px;font-weight:800}
.post .ph span{font-size:11px;color:var(--dim);font-weight:700}
.post pre{white-space:pre-wrap;word-break:break-word;font-family:var(--f);font-size:14px;line-height:1.45;background:#161616;border-radius:10px;padding:10px;max-height:300px;overflow:auto}
.post textarea{font-size:14px;min-height:110px;background:#161616}
.thumbs{display:flex;gap:6px;margin-top:8px;align-items:center}.thumbs img{width:38px;height:56px;object-fit:cover;border-radius:6px;border:1px solid #333}
.mimg{width:100%;border-radius:12px;display:block;margin-bottom:8px;border:1px solid #333}
.layouts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}.layouts button{width:34px;padding:7px 0;border-radius:9px;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--mute);font-weight:800;font-size:13px}
.layouts button.on{border-color:var(--yellow);color:var(--yellow)}
/* codes */
.code{display:grid;grid-template-columns:58px 1fr;gap:10px;background:#101010;border:1px solid #2A2A2A;border-radius:14px;padding:10px;margin-bottom:8px}
.slip{width:58px;height:86px;border-radius:9px;background:#1E1E1E;border:1px dashed #333;display:grid;place-items:center;overflow:hidden;font-size:11px;color:var(--dim);font-weight:700;padding:0}
.slip img{width:100%;height:100%;object-fit:cover}
.code .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:900;font-size:14px}
.code .ins{display:grid;grid-template-columns:1fr 84px;gap:6px}.code .ins input{padding:9px 10px;font-weight:700}
.seg{display:flex;gap:6px;margin-top:8px}.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:12.5px;font-weight:800;background:#1E1E1E;border:1px solid #2A2A2A;color:var(--dim)}
.seg button.on[data-v=pending]{border-color:#555;color:#fff}.seg button.on[data-v=won]{border-color:var(--green);color:var(--green);background:#0F2A1A}.seg button.on[data-v=lost]{border-color:var(--red);color:var(--red);background:#2A0F0F}
.pick{display:flex;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid #262626;font-size:13.5px}.pick:last-child{border:0}.pick span{flex:1}
.pick button{padding:7px 10px;border-radius:9px;background:#1E1E1E;border:1px solid #2A2A2A}
.pick button.on.w{border-color:var(--green);background:#0F2A1A}.pick button.on.x{border-color:var(--red);background:#2A0F0F}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daybar strong{font-size:17px;font-weight:900}.daybar button{width:42px;height:38px;border-radius:10px;background:#161616;border:1px solid #333;font-size:18px}
/* history */
.hrow{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid #262626;padding:11px 0}.hrow:last-child{border:0}
.hrow .a{display:flex;justify-content:space-between;font-size:14px;font-weight:800}.hrow .a span{font-size:11.5px;color:var(--dim)}
.hrow .b{font-size:12.5px;color:var(--dim);margin-top:3px}
.fol{width:100%;border-collapse:collapse;font-size:12.5px}.fol th,.fol td{padding:7px 3px;text-align:right;border-bottom:1px solid #262626}.fol th{color:var(--dim);font-weight:700}
.fol th:first-child,.fol td:first-child{text-align:left}.fol small{display:block;font-size:10px}.up{color:var(--green)}.down{color:var(--red)}
/* elite */
.mem{padding:12px 0;border-bottom:1px solid #262626}.mem:last-child{border:0}
.card>.mem{border-bottom:1px solid var(--acc)!important}.card>.mem:last-child{border-bottom:0!important}
.mem .t{display:flex;justify-content:space-between;align-items:center;gap:8px}.mem .t strong{font-size:15px}
.tag{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:99px;border:1px solid}
.tag.ok{color:var(--green);border-color:#1E5A34}.tag.due{color:var(--yellow);border-color:#5A4A1A}.tag.exp{color:var(--red);border-color:#5A1E1E}
.mem .s{font-size:12.5px;color:var(--dim);margin-top:3px}.mem ul{margin:8px 0 0 18px;font-size:12.5px;color:var(--dim)}
.mem .btn-row button{padding:9px}
/* settings */
.set-group{margin-bottom:16px;animation:cardIn .3s both}
.set-title{font-size:10px;letter-spacing:2px;color:var(--dim);font-weight:800;margin:0 4px 8px;text-transform:uppercase}
.set-list{background:#161616;border:1px solid #333;border-radius:16px;overflow:hidden}
.set-row{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid #262626;padding:13px 14px;text-align:left}
.set-row:last-child{border:0}.set-row:active{transform:none;background:#1C1C1C}
.set-row .i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:#1E1E1E;flex:none;overflow:hidden}.set-row .i img{width:100%;height:100%;object-fit:contain;background:#fff}
.set-row .t{flex:1;min-width:0;font-size:14px;font-weight:800}.set-row .t small{display:block;font-size:11.5px;color:var(--dim);font-weight:600;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.set-row .v{font-size:12.5px;color:var(--dim);font-weight:700}.set-row .ch{color:#555;font-size:20px}
/* video */
.stage{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:12px}
.screen{width:min(100%,calc(52vh * 9 / 16));aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;border:1px solid #333}
.screen canvas{width:100%;height:100%;display:block}
.rec.on{background:#fff!important;color:#B8D63B!important}
.match{background:#101010;border:1px solid #2A2A2A;border-radius:14px;padding:10px;margin-bottom:10px}
.match.cur{border-color:var(--orange)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:12px;font-weight:800;color:var(--dim)}
.mhead button{background:none;border:0;color:var(--dim);font-size:12px;font-weight:700}
.mgrid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px;align-items:center}
.side{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.crest{width:68px;height:68px;padding:6px;border-radius:12px;background:#fff;display:grid;place-items:center;color:#8A8A8A;font-size:28px;font-weight:700;overflow:hidden;border:0}
.crest img{width:100%;height:100%;object-fit:contain}
.side input{text-align:center;padding:10px 6px;font-weight:700}
.score{display:flex;align-items:center;gap:5px}.score input{width:48px;font-size:22px;font-weight:900;padding:6px 0;text-align:center}.score span{color:var(--dim);font-weight:900}
.tpls{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.tpls::-webkit-scrollbar{display:none}
.tpls button{flex:0 0 84px;padding:5px;border-radius:12px;background:#101010;border:1px solid #2A2A2A;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--mute)}
.tpls img,.tpls .add{width:100%;aspect-ratio:9/16;border-radius:8px;object-fit:cover;display:block}
.tpls .add{display:grid;place-items:center;border:1px dashed #444;font-size:24px;color:var(--dim)}
.tpls button.on{border-color:var(--orange);color:var(--orange)}
/* crest library */
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cgrid button{background:#161616;border:1px solid #2A2A2A;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.cgrid .cb{width:44px;height:44px;background:#fff;border-radius:9px;display:grid;place-items:center;padding:3px}.cgrid .cb img{max-width:100%;max-height:100%}
.cgrid span{font-size:10px;color:var(--mute);width:100%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.cgrid button.dup{border-color:var(--orange)}
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.igrid button{padding:0;border:1px solid #2A2A2A;border-radius:10px;overflow:hidden;background:#101010;aspect-ratio:1;position:relative}
.igrid img{width:100%;height:100%;object-fit:cover}.igrid .u{position:absolute;left:4px;bottom:4px;font-size:9.5px;background:rgba(0,0,0,.7);padding:2px 6px;border-radius:99px;color:var(--mute)}
/* layers */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:500;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal-box{background:#161616;border-radius:20px 20px 0 0;padding:20px 18px calc(28px + env(safe-area-inset-bottom,0px));width:100%;max-width:480px;border-top:1px solid #2A2A2A;max-height:90vh;overflow-y:auto;animation:popIn .24s cubic-bezier(.22,.8,.3,1) both}
.modal-title{font-size:16px;font-weight:900;margin-bottom:12px}
.sub{position:fixed;inset:0;background:#000;z-index:300;overflow-y:auto;display:none;padding-bottom:40px}
.sub.open{display:block;animation:subIn .24s cubic-bezier(.22,.8,.3,1) both}
.subhead{position:sticky;top:0;z-index:2;background:rgba(0,0,0,.92);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid #222}
.subhead button{width:40px;height:40px;border-radius:12px;background:#161616;border:1px solid #333;font-size:20px}
.subhead h2{font-size:17px;font-weight:900;flex:1}
.subbody{max-width:480px;margin:0 auto;padding:12px 16px}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:#1E1E1E;border:1px solid #333;padding:11px 20px;border-radius:99px;font-size:13px;font-weight:700;z-index:900;display:none;animation:popIn .26s cubic-bezier(.22,.8,.3,1) both;max-width:92vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.6)}
.toast.on{display:block}
video.res-v{width:min(100%,calc(52vh * 9 / 16));aspect-ratio:9/16;display:block;margin:0 auto 12px;border-radius:12px;background:#000}

.ico{display:block;width:100%;height:100%}.ico svg{width:100%;height:100%;display:block}
.todo .ic{background:none;position:relative;overflow:visible}
.todo .ic .main{width:40px;height:40px;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:#1E1E1E}
.todo .ic .bdg{position:absolute;right:-4px;bottom:-4px;width:19px;height:19px;border-radius:50%;background:#161616;border:2px solid #161616;display:grid;place-items:center;font-size:10px;overflow:hidden}
.bi{width:15px;height:15px;display:inline-block;vertical-align:-3px;margin-right:6px;flex:none}.bi svg{width:100%;height:100%;display:block}
.summary-box.sw{cursor:pointer;font-family:var(--f);color:#fff;transition:border-color .18s,background .18s}
.summary-box.sw.on{background:#1C1C1C;border-color:var(--sel)}.summary-box.sw.on .bl{color:var(--sel)}
.noanim,.noanim *{animation:none!important}

<script>
(()=>{
'use strict';
// Match Vision app 3.0 - built on the Sure Stake 707 Hub design (v47.1): same font, cards, buttons, sheets, tabs and
// share buttons, in Match Vision colours. Data comes ONLY from feed.json, which the laptop builder sends to GitHub
// (after every review, every finished match and the results). The app never sends anything back: the bot is the boss.
// Live scores: the app asks ESPN's free scoreboard itself while it is open.
// Storage: only keys that start with "mv_app_" (never touches other apps).
const VERSION='3.10';   // APP_VERSION = '3.10' (the laptop reads this line for its "APP UPDATED" message)
try{document.getElementById('tver').textContent='v'+VERSION;}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let toastT;function toast(t,ms=2600){const el=$('toast');el.textContent=t;el.classList.remove('on');void el.offsetWidth;el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),ms);}

// ---------- Dates (Sure Stake) ----------
const pad=n=>String(n).padStart(2,'0');const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;const todayKey=()=>keyOf(new Date());
const dateOf=k=>{const [y,m,d]=String(k).split('-').map(Number);return new Date(y,(m||1)-1,d||1);};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const longDate=k=>{const d=dateOf(k);return `${DAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;};
const shortDate=k=>{const d=dateOf(k);return `${DAYS[d.getDay()].slice(0,3)} ${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}`;};
const addDays=(k,n)=>{const d=dateOf(k);d.setDate(d.getDate()+n);return keyOf(d);};
const daysBetween=(a,b)=>Math.round((dateOf(b)-dateOf(a))/864e5);
const fmtT=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const inMins=m=>m>=60?`${Math.floor(m/60)}h ${m%60}m`:`${m} min`;

// ---------- Storage (this app only: mv_app_*) ----------
const K={feed:'mv_app_feed',pin:'mv_app_pin',set:'mv_app_set',tab:'mv_app_tab',espn:'mv_app_espn',posted:'mv_app_posted',marks:'mv_app_marks'};
const store={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const jget=(k,d)=>{try{const v=JSON.parse(store.get(k)||'null');return v==null?d:v;}catch(e){return d;}};
const DEF={live:true,every:2,bot:'MatchVision707Bot',channel:'https://t.me/matchvision707',youtube:'https://www.youtube.com/@MatchVision707',url:'feed.json',
  apps:{wa:true,x:true,ig:true,tt:true,th:true,yt:true,tg:false},
  bold:true,boldTitle:true,boldBrand:true,boldLeague:false,boldWatch:true,uniBold:true,tags:true,hand:true,tgBold:'letters',tagsOff:{tg:true},
  showOdds:true,showChance:false,showPred:true,showFin:true,sort:'time',homeView:'posts',groups:{morning:true,video:true,swipe:true,shorts:true,results:true},
  vidCards:true,recRange:'week',premMembers:true};
let SET=Object.assign({},DEF,jget(K.set,{}));if(!SET.v37){SET.v37=1;SET.showFin=false;}if(!SET.v36){SET.v36=1;SET.boldLeague=false;SET.tgBold=SET.tgBold||'letters';SET.tagsOff=Object.assign({tg:true},SET.tagsOff||{});}SET.apps=Object.assign({},DEF.apps,SET.apps||{});SET.groups=Object.assign({},DEF.groups,SET.groups||{});
const saveSet=()=>store.set(K.set,JSON.stringify(SET));
let POSTED=jget(K.posted,{});   // date -> item id -> app -> true  (what YOU sent from this phone)
const savePosted=()=>{const keep=addDays(todayKey(),-21);for(const k of Object.keys(POSTED))if(k<keep)delete POSTED[k];store.set(K.posted,JSON.stringify(POSTED));};

// ---------- the feed ----------
let feed=null,source='',prem=null,premErr='',lastLoad=0;
async function loadFeed(quiet){
  try{const u=SET.url||'feed.json';const r=await fetch(u+(u.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error(r.status);
    const j=await r.json();if(!j||j.app!=='Match Vision')throw new Error('not a Match Vision feed');
    feed=j;source='online';lastLoad=Date.now();store.set(K.feed,JSON.stringify(j));await unlockPremium(true);if(!quiet)toast('Updated ✓');}
  catch(e){if(!feed){const s=store.get(K.feed);if(s){try{feed=JSON.parse(s);source='saved';await unlockPremium(true);}catch(_){}}}if(!quiet)toast(feed?'Offline: showing the last saved picks':'No picks yet');}
  refresh();}
const days=()=>(feed&&feed.days)||[];
const dayOf=k=>days().find(d=>d.date===k)||null;
function todayDay(){const t=todayKey();return dayOf(t)||days().find(d=>(d.matches||[]).some(m=>(m.date||d.date)===t))||null;}
const upcomingDays=()=>{const t=todayKey();return days().filter(d=>d.date>t).sort((a,b)=>a.date<b.date?-1:1);};
const pastDays=()=>{const t=todayKey();return days().filter(d=>d.date<=t).sort((a,b)=>a.date<b.date?1:-1);};
const media=p=>p?(/^https?:/.test(p)?p:p.replace(/^\.?\//,'')):'';

// ---------- Vision Premium lock (same as the laptop: PBKDF2 + HMAC-SHA256) ----------
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
function cat(a,b){const r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r;}
async function unlockWith(lock,pin){const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pin),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:b64(lock.salt),iterations:lock.iter,hash:'SHA-256'},base,256);
  const key=await crypto.subtle.importKey('raw',bits,{name:'HMAC',hash:'SHA-256'},false,['sign']);
  const nonce=b64(lock.nonce),ct=b64(lock.ct);const mac=new Uint8Array(await crypto.subtle.sign('HMAC',key,cat(nonce,ct)));const want=b64(lock.mac);
  if(mac.length!==want.length||mac.some((x,i)=>x!==want[i]))return null;
  const out=new Uint8Array(ct.length);
  for(let i=0,off=0;off<ct.length;i++,off+=32){const c=new Uint8Array(4);new DataView(c.buffer).setUint32(0,i);const ks=new Uint8Array(await crypto.subtle.sign('HMAC',key,cat(nonce,c)));for(let j=0;j<32&&off+j<ct.length;j++)out[off+j]=ct[off+j]^ks[j];}
  return JSON.parse(new TextDecoder().decode(out));}
async function unlockPremium(quiet,pin){premErr='';const lock=feed&&feed.premium_lock;const p=pin||store.get(K.pin);if(!lock||!p){prem=null;return false;}
  try{const body=await unlockWith(lock,p);if(!body){prem=null;premErr='Wrong PIN. Use the PIN typed in Connect > App on the laptop.';if(pin)store.del(K.pin);return false;}prem=body;if(pin)store.set(K.pin,pin);return true;}
  catch(e){prem=null;premErr='This phone could not open the lock ('+e.message+').';return false;}}

// ---------- Live scores (ESPN, free) ----------
let ESPN=jget(K.espn,{});
let MARKS=jget(K.marks,{});   // 3.3: picks YOU marked won or lost on this phone (date|n.i -> 'w' / 'l', sent:true when sent to the laptop)
function markOf(d,m,i){const x=MARKS[`${d.date}|${m.n}.${i+1}`];return x&&x.v||null;}
function saveMarks(){store.set(K.marks,JSON.stringify(MARKS));}
function espnFix(ev){try{const c=ev.competitions[0];const h=c.competitors.find(x=>x.homeAway==='home'),a=c.competitors.find(x=>x.homeAway==='away');
  const s=(c.status||ev.status),t=s.type||{},nm=String(t.name||'');let st=t.state==='pre'?'NS':t.state==='in'?(/HALF_?TIME/i.test(nm)?'HT':'LIVE'):'FT';
  if(/POSTPONED|DELAYED/i.test(nm))st='PST';if(/CANCEL|ABANDON|FORFEIT|SUSPEND/i.test(nm))st='CANC';
  const g=v=>{const n=parseInt(v,10);return isNaN(n)?null:n;};const fh=x=>x.linescores&&x.linescores[0]&&x.linescores[0].value!=null?g(x.linescores[0].value):null;const no=['NS','PST','CANC'].includes(st);
  return {id:String(ev.id),home:h.team.displayName,away:a.team.displayName,st,min:st==='LIVE'?(parseInt(s.displayClock,10)||null):null,gh:no?null:g(h.score),ga:no?null:g(a.score),hh:fh(h),ha:fh(a),at:new Date().toISOString(),src:'phone'};}catch(e){return null;}}
async function espnDay(k){const r=await fetch(`https://site.api.espn.com/apis/site/v2/sports/soccer/all/scoreboard?dates=${k.replace(/-/g,'')}&limit=1000`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const j=await r.json();return (j.events||[]).map(espnFix).filter(Boolean);}
const STOP=new Set(['fc','cf','afc','sc','ac','as','club','de','the','cd','sd','ss','us','fk','sk','bk','if','ssc','calcio','football','sporting','al','el','la','le','1']);
const ALIAS={cologne:'koln',internazionale:'inter','paris saint germain':'psg','paris sg':'psg','bayern munchen':'bayern munich','stade brestois 29':'brest','stade brestois':'brest'};
function words(n){return String(n||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w&&!STOP.has(w));}
function sameTeam(a,b){const al=x=>{const w=words(x).join(' ');return ALIAS[w]||w;};const A=al(a).split(' ').filter(Boolean),B=al(b).split(' ').filter(Boolean);if(!A.length||!B.length)return 0;if(A.join(' ')===B.join(' '))return 1;let hit=0;for(const w of A){if(B.some(x=>x===w||(w.length>3&&x.length>3&&(x.startsWith(w)||w.startsWith(x)))))hit++;}return hit/Math.min(A.length,B.length);}
function findGame(m,games){if(m.live&&m.live.espn){const g=games.find(x=>x.id===String(m.live.espn));if(g)return g;}let best=null,sc=0;
  for(const g of games){const s1=sameTeam(m.home,g.home),s2=sameTeam(m.away,g.away),s=Math.min(s1,s2)*.6+Math.max(s1,s2)*.4;if(Math.min(s1,s2)<0.5)continue;if(s>sc){sc=s;best=g;}}return sc>=0.72?best:null;}
let liveBusy=false;
async function liveTick(force){if(!SET.live||liveBusy||!feed||!navigator.onLine||document.hidden)return;const t=todayKey(),want=new Set([t,addDays(t,-1)]);const ds=new Set();
  for(const d of days())for(const m of d.matches||[])if(want.has(m.date||d.date)&&!(m.live&&['FT','CANC'].includes(m.live.st)))ds.add(m.date||d.date);
  if(!ds.size)return;liveBusy=true;let ok=false;
  try{for(const k of ds){const old=ESPN[k];if(!force&&old&&Date.now()-old.at<(SET.every||2)*60e3)continue;try{ESPN[k]={at:Date.now(),games:await espnDay(k)};ok=true;}catch(e){}}
    for(const k of Object.keys(ESPN))if(!want.has(k))delete ESPN[k];store.set(K.espn,JSON.stringify(ESPN));}finally{liveBusy=false;}
  if(ok&&!subRender&&!$('sheet').classList.contains('open'))refresh(true);else if(ok&&subRender)rerenderSub();}
const RANK={NS:0,PST:1,LIVE:2,HT:2,NF:3,CANC:3,FT:4};
function liveOf(m,d){const k=m.date||d.date,mine=ESPN[k]&&findGame(m,ESPN[k].games||[]);const lap=m.live;if(!mine)return lap||null;if(!lap)return mine;
  const a=RANK[mine.st]||0,b=RANK[lap.st]||0;if(b>a)return lap;if(a>b)return Object.assign({},mine,{hh:mine.hh!=null?mine.hh:lap.hh,ha:mine.ha!=null?mine.ha:lap.ha});
  if(a===2&&(lap.min||0)>(mine.min||0))return lap;return Object.assign({},mine,{hh:mine.hh!=null?mine.hh:lap.hh,ha:mine.ha!=null?mine.ha:lap.ha});}

// ---------- Is a pick won? (the same rules as the laptop's 23:45 results) ----------
function evalRule(r,L){if(!r||!L||L.gh==null||L.ga==null||['NS','PST','CANC'].includes(L.st))return null;const fin=L.st==='FT',h=L.gh,a=L.ga,tot=h+a;
  const out=(now,sureW,sureL)=>sureW?'w':sureL?'l':fin?(now?'w':'l'):(now?'up':'dn');
  switch(r.t){case 'g':return r.o==='o'?out(tot>r.v,tot>r.v,false):out(tot<r.v,false,tot>r.v);
    case 'g1':{if(L.hh==null||L.ha==null)return null;const t1=L.hh+L.ha,done=fin||L.st==='HT'||(L.st==='LIVE'&&(L.min||0)>45);const now=r.o==='o'?t1>r.v:t1<r.v;return done?(now?'w':'l'):(now?'up':'dn');}
    case 'win':return out(r.s==='h'?h>a:a>h,false,false);case 'dc':return out(r.s==='h'?h>=a:a>=h,false,false);case 'draw':return out(h===a,false,false);
    case 'btts':return r.y?out(h>0&&a>0,h>0&&a>0,false):out(!(h>0&&a>0),false,h>0&&a>0);
    case 'ts':{const g=r.s==='h'?h:a;return out(g>r.v,g>r.v,false);}default:return null;}}
function pickState(p,i,m,d,L){const mk=markOf(d,m,i);if(mk)return mk;const res=(d.results&&d.results.matches||[]).find(x=>x.n===m.n);const off=res&&res.picks&&res.picks[i]&&res.picks[i].won;
  if(off===true)return 'w';if(off===false)return 'l';const e=evalRule(p.rule,L);if(e)return e;if(p.live===true)return 'w';if(p.live===false)return 'l';return null;}
function dayCount(d){let w=0,l=0,p=0;for(const m of d.matches||[]){const L=liveOf(m,d);(m.picks||[]).slice(0,3).forEach((pk,i)=>{const s=pickState(pk,i,m,d,L);if(s==='w')w++;else if(s==='l')l++;else p++;});}return {w,l,p};}
function safestCount(d){let w=0,n=0;for(const m of d.matches||[]){const p=(m.picks||[])[0];if(!p)continue;const s=pickState(p,0,m,d,liveOf(m,d));if(s==='w'){w++;n++;}else if(s==='l')n++;}return {w,n};}
function bankerState(d){if(!d.banker||!d.banker.games)return null;if(d.results&&d.results.banker&&d.results.banker.won!=null)return d.results.banker.won?'w':'l';
  let all=true;for(const g of d.banker.games){const m=(d.matches||[]).find(x=>x.n===g.n);if(!m)return null;const i=(m.picks||[]).findIndex(p=>p.text===(g.pick&&g.pick.text));const s=i<0?null:pickState(m.picks[i],i,m,d,liveOf(m,d));if(s==='l')return 'l';if(s!=='w')all=false;}return all?'w':null;}
function koDate(m,d){const t=String(m.kickoff||'').match(/^(\d{1,2}):(\d{2})$/);if(!t)return null;const x=dateOf(m.date||d.date);x.setHours(+t[1],+t[2],0,0);return x;}
function firstKick(d){const ks=(d.matches||[]).map(m=>koDate(m,d)).filter(Boolean).sort((a,b)=>a-b);return ks[0]||null;}
function mState(m,d){const L=liveOf(m,d);if(L&&['LIVE','HT'].includes(L.st))return 'live';if(L&&L.st==='FT')return 'fin';if(L&&['PST','CANC','NF'].includes(L.st))return 'fin';const ko=koDate(m,d);if(ko&&Date.now()-ko>130*60e3)return 'fin';return 'up';}
const KIND={g:'Goals',g1:'First half',win:'Result',dc:'Win or draw',draw:'Result',btts:'BTTS',ts:'Team goals',stat:'Corners and cards'};
function marketOf(p,i){if(i===0)return 'Safest pick';const r=p.rule||{};if(r.t==='stat')return /card/i.test(p.text)?'Cards':'Corners';return KIND[r.t]||'Prediction';}

  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).catch(()=>{});ok=true;}return ok;}
const enc=encodeURIComponent;
function canShareFiles(files){try{return !!(files.length&&navigator.canShare&&navigator.canShare({files}));}catch(e){return false;}}

function saveFile(f,label){if(!f)return false;try{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);toast((label||'Saved')+' ✓ In your Gallery (Downloads album). iPhone: in Files > Downloads.',3800);return true;}catch(e){toast('Could not save here');return false;}}
const fileCache=new Map();
// 3.6.1: always the WHOLE original file (never a part the video player loaded, never a cached half file)
async function fileOf(path,name){const u=media(path);if(fileCache.has(u))return fileCache.get(u);try{let r=null,b=null;for(let t=0;t<2&&!b;t++){r=await fetch(u+(u.includes('?')?'&':'?')+'full='+Date.now(),{cache:'no-store'});if(r.status!==200)continue;const want=parseInt(r.headers.get('content-length')||'0',10);const x=await r.blob();if(x.size>1000&&(!want||x.size>=want))b=x;}if(!b)throw 0;const ext=(b.type.split('/')[1]||'jpg').replace('jpeg','jpg');const f=new File([b],`${name}.${ext}`,{type:b.type||'image/jpeg'});fileCache.set(u,f);return f;}catch(e){return null;}}
async function shareTo(kind,text,files=[]){
  if(kind==='copy'){toast(copyText(text)?'Copied':'Copy failed. Long-press the text instead.');return false;}
  if(text)copyText(text);
  if(kind==='x'&&files.length>4)files=files.slice(0,4);
  const withFiles=canShareFiles(files);
  if(navigator.share&&(withFiles||kind==='wa'||!['x','th','tg'].includes(kind))){try{await navigator.share(withFiles?(text?{files,text}:{files}):{text});
      if(kind==='wa')toast('Pick WhatsApp, then your Match Vision channel',3500);else if(['ig','tt','yt'].includes(kind))toast(`Pick ${PNAME[kind]}. The caption is copied: long-press the caption box and tap Paste.`,5000);else if(text&&withFiles)toast('Message copied too. If it is not under the picture, long-press the caption box and tap Paste.',4500);return true;}
    catch(e){if(e.name==='AbortError')return false;}}
  if(files.length&&!withFiles)toast('Text copied. Attach the picture yourself (it is in Match Vision on the laptop).',4000);
  if(kind==='wa'){location.href='https://wa.me/?text='+enc(text);return true;}
  if(kind==='x'){location.href='https://x.com/intent/post?text='+enc(text);return true;}
  if(kind==='th'){location.href='https://www.threads.net/intent/post?text='+enc(text);return true;}
  if(kind==='tg'){location.href='tg://msg?text='+enc(text);return true;}
  toast(`Caption copied. Open ${PNAME[kind]} and paste it.`,4000);return true;}

// ---------- Bold (only the important words) for each app ----------
// WhatsApp: *stars*. X, Instagram, TikTok, Threads, YouTube: bold letters (𝗕𝗼𝗹𝗱), because they have no bold button.
// Telegram: **stars** (Telegram turns them bold when you send). Hashtags and links are never touched.
function uniBold(s){return [...String(s)].map(ch=>{const c=ch.codePointAt(0);if(c>=65&&c<=90)return String.fromCodePoint(0x1D5D4+c-65);if(c>=97&&c<=122)return String.fromCodePoint(0x1D5EE+c-97);if(c>=48&&c<=57)return String.fromCodePoint(0x1D7EC+c-48);return ch;}).join('');}
const isTime=l=>/^\s*\d{1,2}:\d{2}\b/.test(l);
const isTags=l=>/^\s*(#\w+\s*)+$/.test(l);
function prepText(t,app){let s=String(t||'');
  if(SET.hand)s=s.replace(/^[ \t]*(?:▶️?|👉|🎥|👇)?[ \t]*(Watch [^:\n]*:)[ \t]*(https?:\/\/\S+)[ \t]*$/gim,'👇 $1\n$2');
  if(!SET.tags||(app&&SET.tagsOff&&SET.tagsOff[app]))s=s.split('\n').filter(l=>!isTags(l)).join('\n').replace(/\n{3,}/g,'\n\n').trim();
  return s;}
function styled(t,app){const s=prepText(String(t||'').replace(/\*\*([^*\n]+)\*\*/g,'$1'),app);if(!SET.bold)return s;
  if(app==='tg'&&SET.tgBold==='none')return s;
  const mode=app==='wa'?'wa':(app==='any'||app==='copy')?'uni':app==='tg'?(SET.tgBold==='stars'?'tg':'uni'):(['x','ig','tt','th','yt'].includes(app)&&SET.uniBold)?'uni':'';if(!mode)return s;
  const B=x=>{const m=x.match(/^(\s*)(.*?)(\s*)$/);if(!m[2])return x;if(mode==='uni'){return m[1]+m[2].replace(/[A-Za-z0-9]+/g,w=>uniBold(w))+m[3];}const st=mode==='wa'?'*':'**';
    const e=m[2].match(/^([^\w\s]+\s*)?(.*?)$/u);const lead=e&&e[1]?e[1]:'';return m[1]+lead+st+m[2].slice(lead.length)+st+m[3];};
  const L=s.split('\n');const firstIdx=L.findIndex(l=>l.trim());
  return L.map((l,i)=>{const tr=l.trim();if(!tr||isTags(tr)||/^https?:\/\//.test(tr)||tr==='--- reply ---')return l;
    if(SET.boldTitle&&i===firstIdx)return B(l);
    if(SET.boldBrand&&/^match vision$/i.test(tr))return B(l);
    if(SET.boldWatch&&/Watch [^:]*:/i.test(tr)){return l.replace(/(Watch [^:]*:)/i,w=>mode==='uni'?w.replace(/[A-Za-z0-9]+/g,x=>uniBold(x)):(mode==='wa'?`*${w}*`:`**${w}**`));}
    if(SET.boldLeague&&!isTime(tr)&&!/[.!?]$/.test(tr)&&tr.length<40){let j=i+1;while(j<L.length&&!L[j].trim())j++;if(j<L.length&&j===i+1&&isTime(L[j]))return B(l);}
    return l;}).join('\n');}
function previewHTML(t){return esc(t).replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/\*([^*\n]+)\*/g,'<b>$1</b>');}
function xParts(t){return String(t||'').split(/\n*---\s*reply\s*---\n*/i).map(x=>x.trim()).filter(Boolean);}

function itemsOf(d){if(!d||!Array.isArray(d.posts))return [];const L=d.posts.filter(it=>SET.groups[it.group]!==false&&appsOf(it).length);
  if(SET.sortByTime===false)return L;return L.map((it,i)=>[it,i]).sort((a,b)=>{const x=itAt(d,a[0]),y=itAt(d,b[0]);if(x&&y&&x!==y)return x<y?-1:1;if(!x!==!y)return x?-1:1;return a[1]-b[1];}).map(z=>z[0]);}
// 3.6.2: the time each post should go out (laptop Settings), with a colour: red = late, yellow = soon, green = sent
function itAt(d,it){if(it.at)return it.at;if(it.when&&/^\d{1,2}:\d{2}$/.test(it.when))return d.date+'T'+it.when.padStart(5,'0');return null;}
function timeLabel(at){const t=todayKey(),dd=at.slice(0,10),hm=at.slice(11,16);if(dd===t)return hm;if(dd===addDays(t,1))return 'Tmrw '+hm;if(dd===addDays(t,-1))return 'Yest '+hm;const x=new Date(dd+'T12:00:00');return x.toLocaleDateString('en-GB',{weekday:'short',day:'numeric'})+' '+hm;}
function timeState(d,it){const at=itAt(d,it);if(!at)return null;if(isDone(d,it))return 'done';const ms=new Date(at)-new Date();if(ms<0)return 'late';if(ms<=(SET.soonMin||30)*60000)return 'soon';return 'wait';}
function timeChip(d,it){const at=itAt(d,it);if(!at)return '';const s=timeState(d,it);const lab=s==='done'?'✓ '+timeLabel(at):timeLabel(at);return `<span class="tchip t-${s}" data-at="${at}" data-dk="${d.date}" data-iid="${esc(it.id)}">${esc(lab)}</span>`;}
setInterval(()=>{document.querySelectorAll('.tchip').forEach(el=>{const d=dayOf(el.dataset.dk);const it=d&&(d.posts||[]).find(x=>x.id===el.dataset.iid);if(!it)return;const tmp=document.createElement('div');tmp.innerHTML=timeChip(d,it);const c=tmp.firstChild;if(c){el.className=c.className;el.textContent=c.textContent;}});},30000);
const kindOf=it=>/^short/.test(it.id)?'shorts':/^win/.test(it.id)?'results':it.id;
const KINDS=[['games',"Today's games"],['picks','Top picks'],['banker','Banker'],['video','Video post'],['swipe','Swipe post'],['shorts','Shorts'],['results','Results']];
function appsOf(it){const allow=GROUP_APPS[it.group]||APPS;const off=SET.postOff||{};const k=kindOf(it);return APPS.filter(p=>allow.includes(p)&&SET.apps[p]&&!off[k+':'+p]&&it.texts&&it.texts[p]&&!(p==='tg'&&it.auto&&it.auto.tg));}
const postedOf=(d,id)=>((POSTED[d.date]||{})[id])||{};
function isDone(d,it){const p=postedOf(d,it.id);const need=appsOf(it);return need.length>0&&need.every(x=>p[x]);}
function textFor(it,p){const ed=EDITS[editKey(it,p)];const raw=ed!=null?ed:((it.texts&&(it.texts[p]||it.texts.wa||it.texts.tg))||'');const s=styled(raw,p);return p==='x'?xParts(s)[0]||s:s;}

  if(ok&&p!=='copy'){POSTED[d.date]=POSTED[d.date]||{};const o=POSTED[d.date][it.id]=POSTED[d.date][it.id]||{};o[p]=true;savePosted();
    const next=itemsOf(d).find(x=>!isDone(d,x));setTimeout(()=>toast(isDone(d,it)?(next?`Done ✓ Next: ${next.title}`:'Everything for this day is sent ✓'):`Sent to ${PNAME[p]} ✓`,3000),900);}
  refresh(true);if(subRender)rerenderSub();}

// ---------- short team names and short pick words (from the laptop's Settings) ----------
function shortTeam(n){if(!SET.shortNames)return n;const t=(feed&&feed.short_names)||{};if(String(n).length<=14)return n;return t[n]||n;}
function shortPick(text){let s=String(text||'');if(SET.shortNames){const t=(feed&&feed.short_names)||{};for(const [a,b] of Object.entries(t).sort((x,y)=>y[0].length-x[0].length)){if(a&&s.toLowerCase().includes(a.toLowerCase())){s=s.replace(new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i'),b);break;}}}
  const w=String((feed&&feed.short_words)||'');for(const part of w.split(';')){const i=part.indexOf('=');if(i>0){const a=part.slice(0,i).trim(),b=part.slice(i+1).trim();if(a)s=s.replace(new RegExp(a.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'ig'),b);}}
  return s.replace(/\s{2,}/g,' ').trim();}

// ---------- pictures at each platform's best size ----------
const SIZES={ig:{'4:5':[1080,1350],'1:1':[1080,1080]},tt:{'9:16':[1080,1920]},th:{'4:5':[1080,1350]}};
async function fitFile(file,app){try{if(!file||!/^image\//.test(file.type)||SET.originalFiles!==false)return file;const want=app==='ig'?SIZES.ig[SET.igSize]:app==='tt'?SIZES.tt[SET.ttSize]:app==='th'?SIZES.th['4:5']:null;if(!want)return file;
  const url=URL.createObjectURL(file);const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});URL.revokeObjectURL(url);
  const [W0,H0]=want;if(Math.abs(img.width/img.height-W0/H0)<0.01)return file;const k=img.width>=W0*1.9?2:1;const W=W0*k,H=H0*k;
  const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');g.fillStyle='#050506';g.fillRect(0,0,W,H);
  const cov=Math.max(W/img.width,H/img.height);g.filter='blur(28px) brightness(.35)';g.drawImage(img,(W-img.width*cov)/2,(H-img.height*cov)/2,img.width*cov,img.height*cov);g.filter='none';
  const con=Math.min(W/img.width,H/img.height);g.drawImage(img,(W-img.width*con)/2,(H-img.height*con)/2,img.width*con,img.height*con);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.95));return blob?new File([blob],file.name.replace(/\.\w+$/,'')+`-${W0}x${H0}.jpg`,{type:'image/jpeg'}):file;}catch(e){return file;}}

    rows=ms.map(m=>{const p=m.picks[0];if(p.odds)tot*=p.odds;return {h:shortTeam(m.home),a:shortTeam(m.away),hc:m.hc,ac:m.ac,pick:shortPick(p.text),full:p.text,odds:p.odds,ko:m.kickoff};});
    title='TOP PICKS';sub=`${longDate(d.date)} · The safest pick of each match`;}
  if(!rows.length)return null;
  const txt=`⚽ MATCH VISION\n${title.charAt(0)+title.slice(1).toLowerCase()} · ${longDate(d.date)}\n\n`+rows.map((r,i)=>`${i+1}. ${r.h} vs ${r.a}${r.ko?` (${r.ko})`:''}\n👉 ${r.full}${r.odds?` @ ${Number(r.odds).toFixed(2)}`:''}`).join('\n\n')+(tot>1?`\n\n📊 Combined odds: ${tot.toFixed(2)}`:'')+`\n\nNo prediction is 100%. Bet responsibly.`;
  return {o:{kind,title,sub,rows,total:tot,acc:'#DFFB51',accDark:'#8EA334',glow:'rgba(223,251,81,.16)',foot:'MATCH VISION'},txt,name:`Match Vision ${kind==='banker'?'Banker':'Top picks'} ${d.date}`};}
async function shareCard(kind,d){const cd=cardData(kind,d);if(!cd){toast(kind==='banker'?'No banker for this day':'Nothing to show for this day yet');return;}toast('Making the picture…',1500);
  const c=(kind==='match'&&cd.o.big)?await csCanvas(cd.o):(kind==='match'&&SET.winShape==='wide')?await winCanvas(cd.o):await cardCanvas(cd.o);const FM=(kind==='match'||kind==='bankerwon')?winFmt:styled;const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.93));const file=new File([blob],cd.name+'.jpg',{type:'image/jpeg'});const url=URL.createObjectURL(blob);const text=cd.txt;
  openSheet(`<div class="cshare"><img src="${url}" alt=""><button class="btn-save ${kind==='prem'?'gold':''} w100" data-cs="any">Share picture and text (pick any app)</button>
    <div class="cs-apps">${['wa','tg','tt','ig','x','yt'].map(p=>`<button data-cs="${p}">${SVG[p]||''}<span>${PNAME[p]}</span></button>`).join('')}<button data-cs="copy">${SVG.copy||''}<span>Copy text</span></button></div>
    <div class="btn-row"><button class="btn-half" data-cs="save">Save picture</button><button class="btn-half" data-close="1">Close</button></div><div class="muted" style="margin:10px 2px 4px;font-size:12px">Edit the text here first if you want. Each app gets its own bold and hashtags (Settings &gt; Posting).</div><textarea class="cs-text" id="csText" style="min-height:220px">${esc(text)}</textarea></div>`,
    async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.close){closeSheet();return;}const k=b.dataset.cs;if(!k)return;
      const ta=document.getElementById('csText');const text=ta?ta.value:cd.txt;
      if(k==='copy'){toast(copyText(FM(text,'any'))?'Text copied':'Copy failed');return;}
      if(k==='save'){const a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();toast('Picture saved to Downloads');return;}
      if(k==='any'){const tx=(kind==='match'||kind==='bankerwon')?winFmt(text,'any'):styled(text,'any');copyText(tx);if(canShareFiles([file])){try{await navigator.share({files:[file],text:tx});toast('Text copied too: if it is not under the picture, long-press and Paste.',4000);}catch(err){}}else toast('Sharing pictures is not possible here. Tap Save picture.');return;}
      const f2=await fitFile(file,k);await shareTo(k,FM(text,k),[f2]);});}
document.addEventListener('click',e=>{const b=e.target.closest('[data-card]');if(b){e.stopPropagation();e.preventDefault();shareCard(b.dataset.card,dayOf(b.dataset.dk));return;}
  const hs=e.target.closest('#p-history [data-cardshare]');if(hs){e.stopPropagation();e.preventDefault();shareCard('premwon');return;}
  const pc=e.target.closest('#p-elite .pcard');if(pc){e.stopPropagation();shareCard('prem');}},true);
{const _mv=matchesView;matchesView=function(d){const h=_mv(d);if(!d)return h;return `<div class="cardbtns"><button data-card="picks" data-dk="${d.date}">Top picks picture<small>Tap: share to any app</small></button><button data-card="banker" data-dk="${d.date}">Banker picture<small>Tap: share to any app</small></button></div>`+h;};}
window.__mv={styled,xParts,get feed(){return feed;},showTab,openDay,bigCard,openBuilder,openTemplates,openLivePage,askBot,textsSheet};
})();
