<style>
:root{--bg:#0b0b0c;--card:#16171a;--card2:#1f2125;--line:#2a2d33;--txt:#f4f5f2;--mut:#9a9fa8;--lime:#dffb51;--gold:#ecc462;--win:#3ddc84;--lose:#ff5c5c;--wait:#f5c542;--live:#ff3b3b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:10px}
.top img{width:34px;height:34px;border-radius:9px}
.top h1{font-size:18px;margin:0;letter-spacing:.5px;font-weight:900}
.top h1 b{color:var(--lime)}
.top .st{margin-left:auto;font-size:11px;color:var(--mut);text-align:right;line-height:1.3}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--mut);margin-right:5px}
.dot.on{background:var(--live);box-shadow:0 0 8px var(--live);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
main{padding:12px 16px 96px;max-width:720px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.card.lime{border-color:var(--lime)} .card.gold{border-color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}

.state.PST,.state.CANC{background:rgba(245,197,66,.15);color:var(--wait)}
.pick{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:14px;align-items:center}

.pick .o{color:var(--mut);white-space:nowrap;font-size:13px}
.ic{display:inline-flex;width:20px;height:20px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:900;margin-right:8px;flex:none;background:var(--card2);color:var(--mut)}
.ic.w{background:var(--win);color:#062} .ic.l{background:var(--lose);color:#300} .ic.up{background:rgba(61,220,132,.2);color:var(--win)} .ic.dn{background:rgba(255,92,92,.2);color:var(--lose)}
.tag{font-size:10px;font-weight:800;border-radius:5px;padding:1px 6px;margin-right:6px;background:var(--lime);color:#111}
.tag.gold{background:var(--gold)}
.big{font-size:28px;font-weight:900}
.lime{color:var(--lime)} .goldc{color:var(--gold)} .winc{color:var(--win)} .losec{color:var(--lose)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}

<body>
<header>
  <div class="top">
    <img src="icons/icon-192.png" alt="">
    <div class="brand-copy"><h1>MATCH <b>VISION</b></h1><div class="date" id="brandDate"></div></div>
    <div class="head-right"><span class="version">2.2.1</span><div class="st" id="st"></div></div>
  </div>
  <div class="days" id="days"></div>
</header>
<main id="main"></main>
<nav id="nav">
  <button class="nav-btn on" data-t="home"><span class="ni">🏠</span>Home</button>
  <button class="nav-btn" data-t="records"><span class="ni">📊</span>Records</button>
  <button class="nav-btn" data-t="video"><span class="ni">🎬</span>Video</button>
  <button class="nav-btn" data-t="premium"><span class="ni">👑</span>Premium</button>
  <button class="nav-btn" data-t="settings"><span class="ni">⚙️</span>Settings</button>
</nav>
<div class="toast" id="toast"></div>
<script>
// Match Vision app 2.2
// - feed.json: written by the Match Vision builder on the laptop and sent to GitHub (after every review, every finished
//   match and the 23:45 results). The Vision Premium part is locked with the PIN typed in Connect > App on the laptop.
// - live scores: the app asks ESPN's free scoreboard itself (no key), so picks turn won or lost while you watch.
// - members are changed ONLY by the bot (member / renew / remove). The app copies the bot word and opens the bot chat.
// Storage: only keys starting with "mv_app_" (never touches other apps).
const APP_VERSION = '2.2.1';
const K = {feed:'mv_app_feed', pin:'mv_app_pin', set:'mv_app_set', tab:'mv_app_tab', espn:'mv_app_espn'};
const $ = s => document.querySelector(s);
const store = {get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}}};
const DEF = {live:true, every:2, bot:'MatchVision707Bot', url:'feed.json'};
let SET = Object.assign({}, DEF, (()=>{try{return JSON.parse(store.get(K.set)||'{}')}catch(e){return {}}})());
let feed = null, day = 0, tab = store.get(K.tab) || 'home', source = '', prem = null, premErr = '', pickFilter = 'all', memFilter = 'all', recordRange = 'week';
let ESPN = (()=>{try{return JSON.parse(store.get(K.espn)||'{}')}catch(e){return {}}})();   // date -> {at, games}
const saveSet = () => store.set(K.set, JSON.stringify(SET));

function esc(t){return String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200);}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const TODAY = () => iso(new Date());
function addDays(k,n){const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);}
function niceDate(d,long){try{return new Date(d+'T12:00:00').toLocaleDateString('en-GB',long?{weekday:'long',day:'numeric',month:'long'}:{weekday:'short',day:'numeric',month:'short'});}catch(e){return d;}}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);}
function odds(o){return o ? '@' + Number(o).toFixed(2) : '';}
function copy(t){return (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>true).catch(()=>{try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();return true;}catch(e){return false;}});}

// ------------------------------------------------------------------ feed from the laptop
async function loadFeed(quiet){
  try{
    const u = SET.url || 'feed.json';
    const r = await fetch(u + (u.includes('?')?'&':'?') + 't=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error(r.status);
    const j = await r.json();
    if(!j || j.app !== 'Match Vision') throw new Error('not a Match Vision feed');
    feed = j; source = 'online'; store.set(K.feed, JSON.stringify(j));
    await unlockPremium(true);
    if(!quiet) toast('Updated ✓');
  }catch(e){
    if(!feed){const s=store.get(K.feed); if(s){try{feed=JSON.parse(s);source='saved';await unlockPremium(true);}catch(_){}}}
    if(!quiet) toast(feed ? 'Offline: showing the last saved picks' : 'No picks yet');
  }
  render();
}

// ------------------------------------------------------------------ Vision Premium lock (same as the laptop: PBKDF2 + HMAC-SHA256)
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
function cat(a,b){const r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r;}
async function unlockWith(lock, pin){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt:b64(lock.salt), iterations:lock.iter, hash:'SHA-256'}, base, 256);
  const key = await crypto.subtle.importKey('raw', bits, {name:'HMAC', hash:'SHA-256'}, false, ['sign']);
  const nonce = b64(lock.nonce), ct = b64(lock.ct);
  const mac = new Uint8Array(await crypto.subtle.sign('HMAC', key, cat(nonce, ct)));
  const want = b64(lock.mac);
  if(mac.length !== want.length || mac.some((x,i)=>x!==want[i])) return null;
  const out = new Uint8Array(ct.length);
  for(let i=0, off=0; off<ct.length; i++, off+=32){
    const c = new Uint8Array(4); new DataView(c.buffer).setUint32(0, i);
    const ks = new Uint8Array(await crypto.subtle.sign('HMAC', key, cat(nonce, c)));
    for(let j=0; j<32 && off+j<ct.length; j++) out[off+j] = ct[off+j] ^ ks[j];
  }
  return JSON.parse(new TextDecoder().decode(out));
}
async function unlockPremium(quiet, pin){
  premErr = '';
  const lock = feed && feed.premium_lock;
  const p = pin || store.get(K.pin);
  if(!lock || !p){ prem = null; return false; }
  try{
    const body = await unlockWith(lock, p);
    if(!body){ prem = null; premErr = 'Wrong PIN. Use the PIN typed in Connect > App on the laptop.'; if(pin) store.del(K.pin); return false; }
    prem = body; if(pin) store.set(K.pin, pin); return true;
  }catch(e){ prem = null; premErr = 'This phone could not open the lock (' + e.message + ').'; return false; }
}

// ------------------------------------------------------------------ live scores (ESPN, free)
function espnFix(ev){try{const c=ev.competitions[0];const h=c.competitors.find(x=>x.homeAway==='home'),a=c.competitors.find(x=>x.homeAway==='away');
  const s=(c.status||ev.status), t=s.type||{}, nm=String(t.name||'');
  let st=t.state==='pre'?'NS':t.state==='in'?(/HALF_?TIME/i.test(nm)?'HT':'LIVE'):'FT';
  if(/POSTPONED|DELAYED/i.test(nm))st='PST'; if(/CANCEL|ABANDON|FORFEIT|SUSPEND/i.test(nm))st='CANC';
  const g=v=>{const n=parseInt(v,10);return isNaN(n)?null:n;};
  const fh=x=>x.linescores&&x.linescores[0]&&x.linescores[0].value!=null?g(x.linescores[0].value):null;
  const no=['NS','PST','CANC'].includes(st);
  return {id:String(ev.id),home:h.team.displayName,away:a.team.displayName,st,min:st==='LIVE'?(parseInt(s.displayClock,10)||null):null,

    case 'win': return out(r.s==='h'?h>a:a>h, false, false);

  h+=`<div class="grid2"><div class="stat"><div class="k">Premium record</div><div class="big goldc">${n?Math.round(w/n*100):0}%</div><div class="meta">${w} of ${n} won</div></div><div class="stat"><div class="k">Last 7 days</div><div class="big">${n7?Math.round(w7/n7*100):0}%</div><div class="meta">${w7} of ${n7}</div></div></div>`;
  // members
  const list=memFilter==='due'?due:memFilter==='exp'?exp:all.filter(m=>!isExp(m)||daysBetween(m.until,t)<=60);
  h+=`<h2>Members</h2><div class="chips">${[['all',`All ${active.length+exp.length}`],['due',`Ending soon ${due.length}`],['exp',`Ended ${exp.length}`]].map(([k,l])=>`<button class="chip ${memFilter===k?'on':''}" onclick="memFilter='${k}';render()">${l}</button>`).join('')}</div>`;
  h+=`<button class="act gold" onclick="botWord('add')">+ Add member (through the bot)</button><div class="card" style="margin-top:10px">`;
  h+=list.length?list.map(m=>{const cls=isExp(m)?'exp':isDue(m)?'due':'ok',dl=daysBetween(t,m.until);
    return `<div class="mem"><div class="row"><div><b>${esc(m.name)}</b> <span class="mt ${cls}">${cls==='exp'?'Ended':cls==='due'?'Ends soon':'Active'}</span><div class="meta">${cls==='exp'?'ended':'until'} ${esc(niceDate(m.until))}${dl>=0?' · '+dl+' days left':''} · ${m.months||0} month(s) paid since ${esc(niceDate(m.since))}</div></div></div>
      <div style="display:flex;gap:8px;margin-top:8px"><button class="sm" onclick="botWord('renew','${esc(m.name).replace(/'/g,"\\'")}')">Renew</button><button class="sm" onclick="botWord('remove','${esc(m.name).replace(/'/g,"\\'")}')">Remove</button></div></div>`;}).join(''):'<div class="meta">No members here.</div>';
  h+=`</div><p class="meta">Members are changed only by the bot, so the bot and the app never disagree. The buttons copy the bot word and open your bot: paste it and send. The app shows the change after the bot's answer (about a minute).</p>`;
  return h;
}
function viewVideo(){
  const days=(feed.days||[]).slice().sort((a,b)=>a.date<b.date?1:-1), videos=days.filter(d=>String(d.video_link||'').trim());
  let h=`<h2>Match Vision videos</h2><div class="card"><div class="teams">Your Match Vision video style</div><div class="meta" style="margin-top:5px">The match-card look stays yours. When you share a YouTube link with the bot, it appears here.</div></div>`;
  if(!videos.length){h+='<div class="empty">No video links have been added yet.</div>';return h;}
  for(const d of videos){
    const url=String(d.video_link||'').trim(), id=(url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/)||[])[1];
    const short=/youtube\.com\/shorts\//i.test(url), videoClass=short?' short':'';
    const thumb=id?`<img class="video-thumb${videoClass}" src="https://img.youtube.com/vi/${id}/hqdefault.jpg" alt="Match Vision video preview" loading="lazy">`:`<div class="video-placeholder${videoClass}"><span class="video-badge">MATCH VISION · ${esc(niceDate(d.date))}</span><span class="video-play">▶</span></div>`;
    h+=`<div class="card"><div class="row"><div><div class="teams">${esc(niceDate(d.date))}</div><div class="meta">${(d.matches||[]).length} matches</div></div><span class="tag">VIDEO</span></div>${thumb}<a class="act" href="${esc(url)}" target="_blank" rel="noopener">Watch Video ↗</a></div>`;
  }
  return h;
}
function viewSettings(){
  const b=feed&&feed.builder||{};
  return `<h2>App</h2><div class="card">
    <div class="switch"><div><b>Live scores</b><div class="meta">Picks turn won or lost while matches are played (free, from ESPN).</div></div><button class="sm" onclick="SET.live=!SET.live;saveSet();render()">${SET.live?'ON':'OFF'}</button></div>
    <div class="switch"><div><b>Check live scores every</b><div class="meta">While the app is open.</div></div><div>${[1,2,5].map(n=>`<button class="sm" style="${SET.every===n?'background:var(--lime);color:#111':''}" onclick="SET.every=${n};saveSet();render()">${n} min</button>`).join(' ')}</div></div>
    <div class="switch"><div><b>Your bot</b><div class="meta">The member buttons open this chat.</div></div><span class="meta">@${esc(SET.bot)}</span></div></div>
    <button class="act" onclick="loadFeed();liveTick(true)">Update now</button>
    <h2>Vision Premium</h2><div class="card"><div class="meta">${prem?'Unlocked on this phone.':feed&&feed.premium_lock?'Locked: open the Premium tab and type your PIN.':'Not in the app yet (Connect > App on the laptop, type a PIN).'}</div>${prem?'<button class="act sec" onclick="lockAgain()">Lock Premium on this phone</button>':''}</div>
    <h2>Laptop</h2><div class="card"><div>${esc(b.step||'')}</div><div class="meta">Feed written ${esc(feed&&feed.updated||'')}${source==='saved'?' · offline copy':''}</div></div>
    <h2>How it works</h2><div class="card how">
      <p><b>1.</b> The laptop builder makes the day after your review on Telegram, then sends the picks here (GitHub).</p>
      <p><b>2.</b> While matches are played, this app asks the free live scoreboard itself and ticks every pick ✓ or ✗. The laptop does the same and sends you "FULL TIME" on Telegram for each match.</p>
      <p><b>3.</b> At 23:45 the laptop checks the official results (corners and cards too). They replace the live ticks and fill Records.</p>
      <p><b>4.</b> Vision Premium is locked with your PIN. Members are changed only with the bot words (member, renew, remove). The bot sends you the welcome and renewal texts, and the app shows the list.</p>
      <p><b>5.</b> Nothing here can post or change anything. Control stays in your Telegram bot.</p></div>
    <h2>Feed address</h2><div class="card"><input type="text" id="url" value="${esc(SET.url)}"><button class="act sec" onclick="SET.url=$('#url').value.trim()||'feed.json';saveSet();loadFeed()">Save address</button><div class="meta" style="margin-top:6px">Normally leave it as feed.json.</div></div>
    <div class="meta" style="text-align:center;margin-top:16px">Match Vision app ${APP_VERSION}</div>`;
}

function render(){
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === tab || (tab==='picks' && b.dataset.t==='home')));
  $('#brandDate').textContent=niceDate(TODAY(),true);
  const st=$('#st');
  if(!feed){st.textContent='';$('#days').innerHTML='';$('#main').innerHTML='<div class="empty">No picks yet.<br><br>When the builder on your laptop has made a day, its picks show here.<br><br><button class="act" onclick="loadFeed()">Try again</button></div>';return;}
  const b=feed.builder||{}; const upd=feed.updated?new Date(feed.updated):null;
  const anyLive=todayDays().some(d=>(d.matches||[]).some(m=>{const L=liveOf(m,d);return L&&['LIVE','HT'].includes(L.st);}));
  st.innerHTML=`<span class="dot ${anyLive||b.busy?'on':''}"></span>${anyLive?'Live':b.busy?'Building '+Math.round((b.done||0)*100)+'%':source==='saved'?'Saved':'Updated'}<br>${upd?upd.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}):''}`;
  const days=feed.days||[]; if(day>=days.length) day=0;
  $('#days').innerHTML = tab==='picks' ? days.map((d,i)=>`<button class="chip ${i===day?'on':''}" onclick="day=${i};render()">${esc(niceDate(d.date))}</button>`).join('') : '';
  const v={home:viewHome,picks:viewPicks,video:viewVideo,records:viewRecords,premium:viewPremium,settings:viewSettings}[tab]||viewHome;
  $('#main').innerHTML=v();
}
function go(t){tab=t;store.set(K.tab,t);window.scrollTo(0,0);render();}
function openTodayPicks(){const days=feed&&feed.days||[];let i=days.findIndex(d=>d.date===TODAY());if(i<0)i=days.findIndex(d=>d.date>TODAY());if(i>=0)day=i;go('picks');}
function openRecordDate(value){const wanted=value||($('#recordDate')&&$('#recordDate').value);const i=(feed.days||[]).findIndex(d=>d.date===wanted);if(i<0){toast('No saved matches for that date');return;}day=i;go('picks');}
async function tryPin(){const p=($('#pin').value||'').trim();if(!p){toast('Type your PIN first');return;}toast('Checking…');const ok=await unlockPremium(false,p);toast(ok?'Unlocked ✓':'Wrong PIN');render();}
function lockAgain(){store.del(K.pin);prem=null;toast('Premium locked on this phone');render();}
async function botWord(kind,name){
  let w='';
  if(kind==='add'){const n=prompt('Member name (as you want it in the list):');if(!n)return;const mo=prompt('How many months did they pay?','1')||'1';w=`member ${n.trim()} ${parseInt(mo,10)||1} month`;}
  else if(kind==='renew'){const mo=prompt(`Renew ${name}: how many months?`,'1')||'1';w=`renew ${name} ${parseInt(mo,10)||1} month`;}
  else if(kind==='remove'){if(!confirm(`Remove ${name} from the room? The bot asks you once more.`))return;w=`remove ${name}`;}
  const ok=await copy(w); toast(ok?`Copied "${w}". Paste it in the bot chat and send.`:`Send this to your bot: ${w}`);
  setTimeout(()=>{location.href='https://t.me/'+(prem&&prem.bot||SET.bot);},900);
}
function copyPicks(){const d=(feed.days||[])[day];if(!d)return;
  const t=['MATCH VISION · '+niceDate(d.date),''].concat((d.matches||[]).map(m=>`${m.kickoff?m.kickoff+' ':''}${m.home} vs ${m.away}: ${(m.picks&&m.picks[0]||{}).text||''}${m.score?' ('+m.score+')':''}`)).join('\n');
  copy(t).then(ok=>toast(ok?'Copied ✓':'Copy not allowed here'));}

document.querySelectorAll('nav button').forEach(b => b.onclick = () => go(b.dataset.t));
(async()=>{const s=store.get(K.feed);if(s){try{feed=JSON.parse(s);source='saved';await unlockPremium(true);}catch(e){}}
  render(); await loadFeed(true); liveTick(true);})();
setInterval(()=>{ if(document.visibilityState==='visible') liveTick(false); }, 30000);
setInterval(()=>{ if(document.visibilityState==='visible') loadFeed(true); }, 120000);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible'){ loadFeed(true); liveTick(true); } });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
