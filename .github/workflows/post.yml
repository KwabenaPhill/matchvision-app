name: Cloud posts (laptop off)
# 3.21: one job stays awake for almost 6 hours and posts every item on its minute (GitHub starts timed jobs late).
# The next job waits in line and starts as soon as this one ends, so there is always one, never two.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloud-posts
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Picture maker
        run: pip install --quiet pillow || true
      - name: Post what is due, every minute
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python3 .github/cloud_post.py --wait 345
