name: Cloud posts (laptop off)
on:
  schedule:
    - cron: '*/10 4-12 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloud-posts
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Post what is due
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python3 .github/cloud_post.py
      - name: Save "posted"
        run: |
          if [ -n "$(git status --porcelain cloud)" ]; then
            git config user.name "cloud-poster"
            git config user.email "cloud-poster@users.noreply.github.com"
            git add cloud
            git commit -m "cloud: posted"
            git pull --rebase || true
            git push
          fi
