name: Cloud posts (laptop off)
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cloud-posts
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Picture maker
        run: pip install --quiet pillow || true
      - name: Post what is due
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
        run: python3 .github/cloud_post.py
      - name: Save "posted"
        run: |
          if [ -n "$(git status --porcelain cloud)" ]; then
            git config user.name "cloud-poster"
            git config user.email "cloud-poster@users.noreply.github.com"
            git add cloud
            git commit -m "cloud: posted"
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs && git push && break
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi
